name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Get qpdf
        shell: pwsh
        run: ./tools/prepare-qpdf.ps1 -DestinationDir ./artifacts/qpdf

      - name: Restore
        run: dotnet restore MarkdownExporter.slnx -m:1

      - name: Check formatting
        run: dotnet format MarkdownExporter.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MarkdownExporter.slnx --configuration Release --no-restore -m:1

      - name: Test
        env:
          MDEXPORT_TEST_QPDF: ${{ github.workspace }}\artifacts\qpdf\qpdf.exe
        run: dotnet test MarkdownExporter.Tests/MarkdownExporter.Tests.csproj --configuration Release --no-build --no-restore -m:1

      - name: Publish
        run: dotnet publish MarkdownExporter/MarkdownExporter.csproj --configuration Release --runtime win-x64 --no-restore -m:1
